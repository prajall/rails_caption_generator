services:
  web:
    container_name: cg_web
    build: .
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "1050:3000"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/app_development
      GEMINI_API_KEY: AIzaSyByg2UBE5eE3Kse0lsWy4Tq3Ezqvj-HVyY
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: cg_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  bundle_cache:
